name: gap-inr
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - ipykernel
  # PyTorch stack (installs with CUDA support automatically if available)
  - pytorch>=2.0
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1  # Target CUDA 12.1 for modern GPUs, adjust as needed
  # Scientific computing
  - numpy>=1.22
  - scipy>=1.10
  - pandas>=1.5
  - scikit-image>=0.20
  # Visualization and Utilities
  - matplotlib>=3.5
  - plotly>=5.13
  - tqdm>=4.65
  - pyyaml>=6.0
  - boto3>=1.26
  - einops>=0.6
  # Experiment logging
  - wandb>=0.15
  - tensorboard>=2.12
  - pip:
      - opencv-python>=4.7
