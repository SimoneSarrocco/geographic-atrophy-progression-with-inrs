# lakeFS / S3 credentials. OPTIONAL.
#
# lakeFS (https://lakefs.io) is an open-source versioning layer over an S3-compatible
# bucket. Use it only if your images live in one. If they are on local disk under the
# layout in docs/DATA.md, ignore this file entirely: the code reads from disk by default.
#
# TO ENABLE IT
#
#   1. cp configs/lakefs_cfg.example.yaml configs/lakefs_cfg.yaml
#   2. fill in the four values below
#   3. point configs/config_data.yaml at your repository, in the `lakefs:` block of the
#      dataset section:
#
#          lakefs:
#            repo: my-lakefs-repo      # repository name, shown in the lakeFS web UI
#            branch: main              # branch or commit to read
#            cache_path: ./cache/faf_ga   # where downloaded images are kept
#
#   4. check it before a long run:
#
#          python download_lakefs_data.py --check
#
#      This prints the settings it resolved and makes one request. It never prints your
#      secret key.
#
# NEVER COMMIT the filled-in configs/lakefs_cfg.yaml. It holds secrets, and .gitignore
# already excludes it.
#
# ENVIRONMENT VARIABLES
#
# Every value here can come from the environment instead, which is usually better on a
# cluster or in CI. Environment variables take precedence over this file:
#
#   GAPINR_LAKEFS_ENDPOINT    GAPINR_LAKEFS_ACCESS_KEY    GAPINR_LAKEFS_SECRET_KEY
#   GAPINR_LAKEFS_CA_BUNDLE   GAPINR_LAKEFS_REPO          GAPINR_LAKEFS_BRANCH
#   GAPINR_LAKEFS_CACHE       GAPINR_LAKEFS_CFG  (path of this file)
#
# All three of endpoint, access_key and secret_key are required. Set none of them to
# read from local disk. Setting only some is an error, reported straight away rather
# than as an obscure S3 failure later on.

# The lakeFS S3 gateway, not the web UI. Usually the same host on a different port.
endpoint:    "https://your-lakefs-host:8000"

# Credentials from the lakeFS UI: Administration -> Access Keys -> Create Access Key.
# The secret is shown once, at creation time.
access_key:  "YOUR_ACCESS_KEY_ID"
secret_key:  "YOUR_SECRET_ACCESS_KEY"

# Path to a CA certificate bundle for TLS verification, needed for a self-signed or
# internal certificate authority. Leaving it empty DISABLES certificate verification,
# and the code warns when it does so. Ignored for a plain http endpoint.
ca_bundle:   ""
