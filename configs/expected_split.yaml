_comment: 'Canonical paper split (26 train / 5 val / 6 test), loader-faithful (resolve_split_eyes:
  rows with the modality columns the loader reads). validate_splits ABORTS if a run resolves a
  different partition, guarding against silent split drift. Eye IDs are anonymized placeholders
  (EYE01_OD ...); replace with your own if you use a different cohort. See docs/DATA.md.'
